   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.708229" y="59.768006" transform="rotate(-0 18.708229 59.768006)">Executed state</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(18.708229 79.375163)">MuJoCo state, history, gait</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(18.708229 91.312417)">previous action, drive queues</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(18.708229 103.249672)">Snapshot at each 100 ms replan</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="229.338088" y="59.768006" transform="rotate(-0 229.338088 59.768006)">Feasible command knots</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(229.338088 79.375163)">Shift winner and elite mean</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(229.338088 91.312417)">Sample EE XYZ and body rates</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(229.338088 103.249672)">Optional virtual force or offset</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="459.245933" y="59.768006" transform="rotate(-0 459.245933 59.768006)">Parallel prediction worlds</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(459.245933 79.375163)">Restore actual state into each lane</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(459.245933 91.312417)">Project request at predicted pre-action pose</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(459.245933 103.249672)">B issues force; C encodes reachable offset</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="459.245933" y="192.422569" transform="rotate(-0 459.245933 192.422569)">Policy inside each rollout</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(459.245933 212.029725)">32 × 79 history → encoder + actor</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(459.245933 223.96698)">19 joint actions → delayed, limited PD</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(459.245933 235.904234)">4 × 5 ms dynamics and solved contacts</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="229.338088" y="192.422569" transform="rotate(-0 229.338088 192.422569)">Rank candidate outcomes</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(229.338088 212.029725)">Task cost and validity tests</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(229.338088 223.96698)">Fit elites; select best evaluated</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(229.338088 235.904234)">trajectory with a finite cost</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.708229" y="192.422569" transform="rotate(-0 18.708229 192.422569)">Live execution</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(18.708229 212.029725)">Run first five policy ticks</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(18.708229 223.96698)">Measure motion and contact</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(18.708229 235.904234)">Execution physics can differ</text>
   </g>
