[workspace]
name = "unifp-mpc"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.13.12"
numpy = "==2.4.2"
onnxruntime-cpp = { version = "==1.24.2", build = "*_cpu" }
cmake = "==4.2.3"
ninja = "==1.13.2"
gxx_linux-64 = "==14.3.0"
pybind11 = "==3.0.2"

[pypi-dependencies]
mujoco = "==3.6.0"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
view-box = { cmd = "env OPENBLAS_NUM_THREADS=1 PYTHONPATH=build python -B tools/view_box.py", depends-on = ["build"] }
view-cone = { cmd = "env OPENBLAS_NUM_THREADS=1 PYTHONPATH=build python -B tools/view_box.py --task cone", depends-on = ["build"] }
view-wall = { cmd = "env OPENBLAS_NUM_THREADS=1 PYTHONPATH=build python -B tools/wall_mpc.py", depends-on = ["build"] }
view-tether = { cmd = "env OPENBLAS_NUM_THREADS=1 PYTHONPATH=build python -B tools/tether_mpc.py --view", depends-on = ["build"] }
